name: CMS content validation
on:
  pull_request:
    paths:
      - 'content/**'
      - 'admin/**'
      - 'assets/cms-content.js'
      - 'index.html'
      - 'scripts/validate-content.mjs'
      - '.github/workflows/cms-validation.yml'
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'admin/**'
      - 'assets/cms-content.js'
      - 'index.html'
      - 'scripts/validate-content.mjs'
      - '.github/workflows/cms-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check assets/cms-content.js
          node --check scripts/validate-content.mjs
      - name: Validate public content
        run: node scripts/validate-content.mjs
